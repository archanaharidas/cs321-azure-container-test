name: CS321 Docker CI Prototype

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-ci:
    uses: ./.github/workflows/reusable-docker-ci.yml
    with:
      dockerfile: Dockerfile
      container-port: 8080
      health-path: /
      smoke-test: true
