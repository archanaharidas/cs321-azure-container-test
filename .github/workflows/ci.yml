name: CS321 Docker CI Prototype

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cs321-ci-test .

      - name: Start container
        run: docker run -d --name cs321-ci -p 8080:8080 cs321-ci-test

      - name: Wait for application
        run: sleep 5

      - name: Check application
        run: curl --fail http://localhost:8080/

      - name: Stop container
        if: always()
        run: docker rm -f cs321-ci
