name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/archanaharidas/cs321-azure-container-test:latest
            ghcr.io/archanaharidas/cs321-azure-container-test:${{ github.sha }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name cs321-ra-github-test \
            --resource-group cs321-ra-hosting-test \
            --image ghcr.io/archanaharidas/cs321-azure-container-test:${{ github.sha }}
