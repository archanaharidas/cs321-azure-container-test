services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cs321
      POSTGRES_USER: cs321
      POSTGRES_PASSWORD: cs321

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs321 -d cs321"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build:
      context: ..
      dockerfile: db-test/Dockerfile

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cs321
      DB_USER: cs321
      DB_PASSWORD: cs321

    ports:
      - "18080:8080"

    depends_on:
      db:
        condition: service_healthy
